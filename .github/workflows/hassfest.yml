name: Validate add-on

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Add-on configuration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: [earnie, earnie_prerelease]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run Home Assistant Add-on Lint (${{ matrix.addon }})
        uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.addon }}
